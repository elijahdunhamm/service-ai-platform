<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Commercial Cleaning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Critical route fonts (Lato + Playfair for the cleaning-family tenants).
         display=swap keeps text from blocking on font load. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Nunito is used only by the I Dream of Cleaning tenant (/idreamofcleaning),
         so it is deferred (non-blocking) out of the critical path instead of
         competing with Lato/Playfair on every tenant's first paint. It still
         loads right after render (display=swap), so no tenant loses its font. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- Pre-React splash: prevents a flash of unstyled content before the app
         (and the tenant's PageLoader) mounts. Theme-neutral deep purple that
         matches the genie palette. It self-removes once React fills #root. -->
    <div id="app-splash" style="position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3b1366 0%,#12051f 72%);">
      <div style="width:44px;height:44px;border-radius:9999px;border:3px solid rgba(210,52,235,0.25);border-top-color:#d234eb;animation:splash-spin .9s linear infinite;"></div>
      <style>@keyframes splash-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      (function () {
        var s = document.getElementById("app-splash");
        if (!s) return;
        var t = setInterval(function () {
          var r = document.getElementById("root");
          if (r && r.childElementCount > 0) {
            clearInterval(t);
            s.remove();
          }
        }, 50);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
